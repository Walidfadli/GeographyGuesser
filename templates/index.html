<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geography Guesser — Image Test</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  main { width: 100%; max-width: 900px; }
  h1 { margin-top: 0; font-weight: 500; }
  #drop {
    border: 2px dashed #555;
    border-radius: 12px;
    padding: 60px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: #1a1a1a;
  }
  #drop.hover { border-color: #4a9eff; background: #182230; }
  #drop p { margin: 0; color: #aaa; }
  #drop input { display: none; }
  #preview {
    margin-top: 20px;
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
    display: none;
  }
  #status { margin-top: 15px; color: #888; min-height: 1.2em; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
  .panel {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 18px;
  }
  .panel h2 { margin: 0 0 12px 0; font-size: 1rem; color: #9ad; font-weight: 600; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222; }
  .row:last-child { border-bottom: none; }
  .row .name { color: #ddd; }
  .row .conf { color: #8fb; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: #333; border-radius: 2px; margin-top: 2px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, #4a9eff, #8fb); }
  @media (max-width: 600px) { .results { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Geography Guesser</h1>
  <p style="color:#888;margin-top:-10px">Drop a screenshot and let the CNNs guess the continent and country flag.</p>

  <label id="drop" for="file">
    <p>Drag & drop an image here, or click to pick one</p>
    <input id="file" type="file" accept="image/*">
  </label>

  <img id="preview" alt="preview">
  <div id="status"></div>

  <div class="results" id="results" style="display:none">
    <div class="panel">
      <h2>Top continents</h2>
      <div id="continents"></div>
    </div>
    <div class="panel">
      <h2>Top flags</h2>
      <div id="flags"></div>
    </div>
  </div>
</main>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const results = document.getElementById("results");
const continentsEl = document.getElementById("continents");
const flagsEl = document.getElementById("flags");

["dragenter", "dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); })
);
["dragleave", "drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); })
);
drop.addEventListener("drop", e => {
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith("image/")) {
    status.textContent = "Not an image file.";
    return;
  }
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  results.style.display = "none";
  status.textContent = "Running inference...";

  const form = new FormData();
  form.append("image", file);
  fetch("/predict", { method: "POST", body: form })
    .then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || r.statusText)))
    .then(render)
    .catch(err => { status.textContent = "Error: " + err; });
}

function render(data) {
  status.textContent = "";
  results.style.display = "grid";
  continentsEl.innerHTML = "";
  flagsEl.innerHTML = "";
  data.continents.forEach(c => continentsEl.appendChild(row(c.name + " (" + c.label + ")", c.confidence)));
  data.flags.forEach(f => flagsEl.appendChild(row(f.name, f.confidence)));
}

function row(name, conf) {
  const pct = (conf * 100).toFixed(1);
  const el = document.createElement("div");
  el.className = "row-wrap";
  el.innerHTML =
    '<div class="row"><span class="name">' + name + '</span>' +
    '<span class="conf">' + pct + '%</span></div>' +
    '<div class="bar"><span style="width:' + Math.min(100, pct) + '%"></span></div>';
  return el;
}
</script>
</body>
</html>
